
name: Daily AI News Collection

on:
  schedule:
    # Run daily at 08:00 Pakistan time (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect news
        run: python news_collector.py

      - name: Save news reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-reports
          path: |
            news.json
            daily_briefing.md
          if-no-files-found: error
          retention-days: 7
